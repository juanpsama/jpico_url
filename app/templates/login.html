{% extends "components/base.html" %}

{% block content %}
    <div class="container container--narrow shadow">
        <form class="login-form" id="login-form">
            <h2 class="login-heading">Log in</h2>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M22 7l-10 7L2 7"/>
                </svg>
                <input name="username" placeholder="you@example.com" required autocomplete="username">
            </div>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <div id="login-error" class="login-error"></div>
            <button class="shadow" type="submit">Log in</button>
            <p class="login-footer">Don't have an account? <a href="/web/register">Register</a></p>
        </form>
    </div>
{% endblock %}
