{% extends "components/base.html" %}

{% block content %}
    <section class="title">
        <h1>Understand what clicks with your audience</h1>
        <h3>A lightweight URL management tool for creating, sharing, and tracking short links. Use it to spot which channels are pulling their weight so you can double down where it counts.</h3>
    </section>

    <div class="container">
        <div class="input-wrap shadow">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <input id="url-input" type="text" placeholder="https://very-long-url.example.com/path/to/resource?query=to-some-query">
        </div>
        <button id="shorten-btn" class="shadow">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <circle cx="12" cy="5" r="3" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="19" r="3" fill="currentColor" stroke="none"/>
            </svg>
            Shorten
        </button>

        <!-- <div id="shorten-result" class="result-url--visible">
            <span class="result-wrap shadow">
                <a id="result-link" target="_blank" rel="noopener">https://sqlmodel.tiangolo.com/tutorial/relationship-attributes/define-relationships-attributes/</a>
            </span>
            <button id="copy-btn" class="shadow" title="Copy to clipboard">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </button>
        </div> -->
        <span id="message"></span>
        <div id="links-list">
        </div>
    </div>
    <script>
    var LINKS_KEY = 'my_links';

    function getLinks() {
        try {
            // console.log(JSON.parse(localStorage.getItem(LINKS_KEY) || '[]'));
            return JSON.parse(localStorage.getItem(LINKS_KEY) || '{}');
        } catch (_) {
            return {};
        }
    }
    var input = document.getElementById('url-input');
    var btn = document.getElementById('shorten-btn');
    var resultEl = document.getElementById('shorten-result');
    var linkEl = document.getElementById('result-link');
    var copyBtn = document.getElementById('copy-btn');
    var listEl = document.getElementById('links-list');

    function prependLink(shortCode) {
        var shortUrl = window.location.origin + '/' + shortCode;
        var div = document.createElement('div');
        div.className = 'link-entry shorten-result';

        div.innerHTML =
            '<span class="result-wrap shadow">'+
                `<a id="result-link" href='${shortUrl}' target="_blank" rel="noopener">${shortUrl}</a>`+
            '</span>'+
            '<button id="copy-btn" class="shadow" title="Copy to clipboard">'+
                '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+
                    '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>'+
                    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'+
                '</svg>'+
            '</button>'
        div.querySelector('button').addEventListener('click', function () {
            navigator.clipboard.writeText(shortUrl);
            showCopied();
        });
        listEl.insertBefore(div, listEl.firstChild);
    }

    var msgEl = document.getElementById('message');

    function showCopied() {
        msgEl.classList.remove('copied');
        void msgEl.offsetWidth;
        msgEl.classList.add('copied');
        clearTimeout(msgEl._hideTimer);
        msgEl._hideTimer = setTimeout(function () {
            msgEl.classList.remove('copied');
        }, 1500);
    }

    function renderLinks(links) {
        try{
            Object.keys(links).forEach(key => {
                let shortCode = links[key]  
                prependLink(shortCode)                
            });
        }catch(e){
            console.log(e)
        }
    }

    renderLinks(getLinks());

    var btnHtml = btn.innerHTML;

    function setLoading(loading) {
        btn.disabled = loading;
        if (loading) {
            input.value = '';
            btn.innerHTML = '<span class="spinner"></span> Shortening\u2026';
        } else {
            btn.innerHTML = btnHtml;
        }
    }

    btn.addEventListener('click', function () {
        var url = input.value.trim();
        if (!url) return;

        var cached = findLink(url);
        if (cached) {
            input.value = '';
            prependLink(cached);
            return;
        }

        setLoading(true);

        fetch('/shorten', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ original_url: url }),
        })
            .then(function (res) {
                if (!res.ok) {
                    return res.json().then(function (body) {
                        throw new Error(body.detail || 'Failed to shorten');
                    });
                }
                return res.json();
            })
            .then(function (data) {
                saveLink(url, data.short_url_code);
                prependLink(data.short_url_code);
            })
            .catch(function (err) {
                console.error('Shorten failed:', err);
            })
            .finally(function () {
                setLoading(false);
            });
    });
    </script>
{% endblock %}
